<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyMate - Chat & Schedule</title>
    <link rel="stylesheet" href="chatbotScheduler.css">
    <script src="https://kit.fontawesome.com/83a1fb6010.js" crossorigin="anonymous"></script>
</head>
<body>
    <div class="container">
        <!-- Left Sidebar -->
        <aside class="sidebar">
            <div class="app-header">
                <h2>StudyMate</h2>
                <p>Productivity Tool</p>
                <a href="about.html"
                target="_blank">© About</a>
            </div>
            <nav class="menu">
                <a href="dashboard.html">Dashboard</a>
                <a class="active" href="chatbotScheduler.html">Chatbot & Scheduler</a>
                <a href="pomodoroTimer.html">Focus Session</a>
                <a href="flashcards.html">Flashcards</a>
                <a href="noteSummerizer.html">Notes Summarizer</a>
                <a href="settings.html">Settings</a>
            </nav>
        </aside>

        <!-- Right Main Section -->
        <main class="main-content">
            <div class="section-header">
                <h3>Chat & Schedule</h3>
                <p>Chat with Rookie and Schedule your success.</p>
            </div>

            <div class="content-card">
                    <ul class="chatbot-messages" id="chat-list">
                        <li class="incoming">
                            <p class="chat-bubble">Hello There! <br> How can I help you?</p>
                        </li>
                        <li class="outgoing">
                            <p class="chat-bubble">Make a study session for tomorrow</p>
                        </li>
                    </ul>
                    <div class="chat-input-container">
                        <input type="text" placeholder="Ask the AI or schedule an event..." class="chat-input" />
                        <button class="chat-send-button">Send</button>
                    </div>
            </div>
        </main>
    </div>
    <script src="chatbotScheduler.js"></script>
</body>
</html>
