<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyMate - Dashboard</title>
    <link rel="stylesheet" href="dashboard.css">
</head>
<body>
    <div class="container">
        <!-- Left Sidebar -->
        <aside class="sidebar">
            <div class="app-header">
                <h2>StudyMate</h2>
                <p>Productivity Tool</p>
                <a href="about.html"
                target="_blank">© About</a>
            </div>
            <nav class="menu">
                <a class="active" href="dashboard.html">Dashboard</a>
                <a href="chatbotScheduler.html">Chatbot & Scheduler</a>
                <a href="pomodoroTimer.html">Focus Session</a>
                <a href="flashcards.html">Flashcards</a>
                <a href="noteSummerizer.html">Notes Summarizer</a>
                <a href="settings.html">Settings</a>
            </nav>
        </aside>

        <!-- Right Main Section -->
        <main class="main-content">
            <div class="section-header">
                <h3>Dashboard</h3>
                <p>Watch your progress live.</p>
            <div class="container">
                <div class="weeklyProgress">
                    <h1>Your Weekly Progress</h1>
                    <h2>Study Hours</h2>
                    <div class="progress-bar">
                        <div class="study-hours">
                            <span>86</span>
                        </div>
                    </div>
                    <h2>Flashcards Reviewed</h2>
                    <div class="progress-bar">
                        <div class="flashcards-reviewed">
                            <span>86</span>
                        </div>
                    </div>
                    <h2>Focus Sessions</h2>
                    <div class="progress-bar">
                        <div class="focus-sessions">
                            <span>86</span>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="dashboard.js"></script>
</body>
</html>
