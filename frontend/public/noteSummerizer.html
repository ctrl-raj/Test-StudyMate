<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyMate - Note Summerizer</title>
    <link rel="stylesheet" href="noteSummerizer.css">
</head>
<body>
    <div class="container">
        <!-- Left Sidebar -->
        <aside class="sidebar">
            <div class="app-header">
                <h2>StudyMate</h2>
                <p>Productivity Tool</p>
                <a href="about.html"
                target="_blank">© About</a>
            </div>
            <nav class="menu">
                <a href="dashboard.html">Dashboard</a>
                <a href="chatbotScheduler.html">Chatbot & Scheduler</a>
                <a href="pomodoroTimer.html">Focus Session</a>
                <a href="flashcards.html">Flashcards</a>
                <a class="active" href="noteSummerizer.html">Notes Summarizer</a>
                <a href="settings.html">Settings</a>
            </nav>
        </aside>

        <!-- Right Main Section -->
        <main class="main-content">
            <div class="section-header">
                <h3>Notes Summerizer</h3>
                <p>Summerize your notes, efforlessly.</p>
            <div class="focus-box">
                <h4>Content Summeriser</h4>
                <p id="session-title">Upload Content & Summeriser It</p>
                <div class="content" id="content">
                    <button id="start-btn" class="start-btn">Start</button><br>
                    <input type="file" id="file" accept="image/png, image/jpeg, image/jpg">
                    <label for="file" id="file-label">Upload Content</label>
                </div>
                <div class="break-options">
                    <button id="reset-btn" class="break-btn">Reset</button>
                </div>
            </div>
        </main>
    </div>
    <script src="noteSummerizer.js"></script>
</body>
</html>
